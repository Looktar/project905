<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#a9b8cf">
<title>Project 905 · 万锦玩具城</title>
<link rel="manifest" href="manifest.webmanifest">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#a9b8cf;overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
body{font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei","Hiragino Sans GB",system-ui,sans-serif}
#app{position:fixed;left:0;top:0;transform-origin:0 0;overflow:hidden}
#c{position:absolute;left:0;top:0;display:block}
.hud{position:absolute;z-index:5}
#hudwrap{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .4s}
#hudwrap.on{opacity:1}
#hudwrap .ui,#hudwrap .btn,#hudwrap #mini,#joy{pointer-events:auto}
#mini{position:absolute;left:calc(14px + var(--sa-l, 0px));top:calc(14px + var(--sa-t, 0px));border-radius:50%;border:4px solid #fff;box-shadow:0 4px 0 rgba(30,40,70,.25);background:#9fd067;transition:transform .2s}
#mini.small{transform:scale(.62);transform-origin:0 0}
#street{position:absolute;left:50%;top:calc(14px + var(--sa-t, 0px));transform:translateX(-50%) translateY(-8px);background:#fff;color:#2d3a55;border-radius:999px;padding:6px 20px 7px;font-size:clamp(14px,2.3vw,21px);font-weight:800;box-shadow:0 4px 0 rgba(30,40,70,.22);white-space:nowrap;opacity:0;transition:all .3s}
#street.show{opacity:1;transform:translateX(-50%)}
#hp{position:absolute;right:calc(16px + var(--sa-r, 0px));top:calc(16px + var(--sa-t, 0px));display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.94);border-radius:999px;padding:6px 14px;box-shadow:0 4px 0 rgba(30,40,70,.22);opacity:0;transition:opacity .3s}
#hp.show{opacity:1}
#hp .bar{width:min(150px,18vw);height:12px;border-radius:6px;background:#e3e6ee;overflow:hidden}
#hpfill{display:block;height:100%;width:100%;background:#ff5a6a;border-radius:6px;transition:width .2s}
#hp span{color:#ff5a6a;font-size:18px;font-weight:800}
#topright{position:absolute;right:calc(16px + var(--sa-r, 0px));top:calc(60px + var(--sa-t, 0px));display:flex;gap:8px}
.ui{background:rgba(255,255,255,.9);color:#2d3a55;border:none;border-radius:999px;padding:6px 12px;font:700 14px inherit;font-family:inherit;box-shadow:0 3px 0 rgba(30,40,70,.2);cursor:pointer}
#joy{position:absolute;left:calc(46px + var(--sa-l, 0px));bottom:calc(36px + var(--sa-b, 0px));width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.22);border:4px solid rgba(255,255,255,.75);display:none}
#knob{position:absolute;left:44px;top:44px;width:54px;height:54px;border-radius:50%;background:rgba(255,255,255,.92);box-shadow:0 4px 0 rgba(30,40,70,.25)}
body.touch #joy{display:block}
.btn{position:absolute;border-radius:50%;display:none;align-items:center;justify-content:center;font-weight:900;color:#fff;box-shadow:0 5px 0 rgba(30,40,70,.28);border:4px solid #fff;font-family:inherit;transition:transform .05s}
.btn.on{transform:scale(.92)}
body.touch .btn{display:flex}
#bA{right:calc(44px + var(--sa-r, 0px));bottom:calc(44px + var(--sa-b, 0px));width:100px;height:100px;background:#ff6b4a;font-size:28px}
#bB{right:calc(162px + var(--sa-r, 0px));bottom:calc(30px + var(--sa-b, 0px));width:74px;height:74px;background:#3fa7ff;font-size:18px}
#bC{right:calc(70px + var(--sa-r, 0px));bottom:calc(164px + var(--sa-b, 0px));width:74px;height:74px;background:#56c26b;font-size:18px}
#bubbles{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.bub{position:absolute;transform:translate(-50%,-100%);background:#fff;color:#2d3a55;font-weight:900;font-size:clamp(13px,1.9vw,19px);padding:4px 12px 5px;border-radius:12px;border:3px solid #2d3a55;white-space:nowrap}
.bub:after{content:'';position:absolute;left:50%;bottom:-10px;margin-left:-7px;border:7px solid transparent;border-top-color:#2d3a55;border-bottom:0}
.bub.pow{background:none;border:none;color:#ffd23f;font-size:clamp(28px,4vw,44px);-webkit-text-stroke:3px #c2410c;transform:translate(-50%,-50%) rotate(-12deg)}
.bub.pow:after{display:none}
#banner{position:absolute;left:50%;top:62px;transform:translateX(-50%) scale(.9);padding:8px 22px;border-radius:12px;font-weight:900;font-size:clamp(15px,2.4vw,22px);color:#fff;opacity:0;transition:all .3s;white-space:nowrap}
#banner.show{opacity:1;transform:translateX(-50%) scale(1)}
#banner.red{background:#e11d48;box-shadow:0 4px 0 #9f1239}
#banner.green{background:#16a34a;box-shadow:0 4px 0 #166534}
#meter{position:absolute;left:50%;top:106px;transform:translateX(-50%);width:160px;height:8px;border-radius:4px;background:rgba(255,255,255,.6);overflow:hidden;display:none}
#meter i{display:block;height:100%;width:0;background:#16a34a}
#bust{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(20,30,60,.45);color:#fff;font-size:clamp(44px,9vw,96px);font-weight:900;-webkit-text-stroke:3px #1e3a8a;opacity:0;pointer-events:none;transition:opacity .25s}
#bust.show{opacity:1}
#title{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:linear-gradient(rgba(169,184,207,.35),rgba(169,184,207,.75));transition:opacity .5s}
#title.hide{opacity:0;pointer-events:none}
#title h1{margin:0;font-size:clamp(40px,8vw,84px);color:#fff;-webkit-text-stroke:3px #2d3a55;font-weight:900;letter-spacing:2px;text-shadow:0 6px 0 rgba(30,40,70,.25)}
#subtitle{font-size:clamp(16px,2.6vw,24px);font-weight:900;color:#2d3a55;background:#fff;border-radius:999px;padding:4px 18px}
#tagline{color:#2d3a55;font-weight:700;font-size:clamp(13px,1.8vw,17px);text-align:center;padding:0 16px}
#startBtn{margin-top:8px;font-family:inherit;font-size:clamp(20px,3vw,28px);font-weight:900;color:#fff;background:#ff6b4a;border:4px solid #fff;border-radius:999px;padding:10px 46px;box-shadow:0 6px 0 rgba(30,40,70,.3);cursor:pointer}
#startBtn:disabled{opacity:.5}
#controls{color:#2d3a55;font-size:13px;font-weight:700;text-align:center;padding:0 16px}
#credit{position:absolute;bottom:8px;left:0;right:0;text-align:center;color:#2d3a55;font-size:11px;opacity:.8}
#loading{color:#2d3a55;font-weight:700}
#langBtn{position:absolute;top:14px;right:14px}
#dbg{position:absolute;left:50%;bottom:6px;transform:translateX(-50%);color:#fff;font:12px monospace;text-shadow:0 1px 2px #000;z-index:30}
</style>
</head>
<body>
<div id="app">
  <canvas id="c"></canvas>
  <div id="hudwrap">
    <canvas id="mini" width="180" height="180"></canvas>
    <div id="street"></div>
    <div id="hp"><span>♥</span><div class="bar"><i id="hpfill"></i></div></div>
    <div id="topright"><button id="muteBtn" class="ui">🔊</button><button id="qBtn" class="ui"></button></div>
    <div id="banner"></div>
    <div id="meter"><i></i></div>
    <div id="bubbles"></div>
    <div id="joy"><div id="knob"></div></div>
    <div id="bA" class="btn"></div><div id="bB" class="btn"></div><div id="bC" class="btn"></div>
    <div id="bust"></div>
  </div>
  <div id="title">
    <button id="langBtn" class="ui"></button>
    <h1>Project 905</h1>
    <div id="subtitle"></div>
    <div id="tagline"></div>
    <button id="startBtn" disabled></button>
    <div id="loading"></div>
    <div id="controls"></div>
    <div id="credit"></div>
  </div>
  <div id="dbg"></div>
</div>
<script type="module" src="js/main.js"></script>
</body>
</html>
