<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<title>Project 905 · 万锦玩具城</title>
<link rel="manifest" href="manifest.webmanifest">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#a9b8cf;overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{position:fixed;inset:0;width:100%}
body{font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei","Hiragino Sans GB",system-ui,sans-serif}
#app{position:fixed;left:0;top:0;transform-origin:0 0;overflow:hidden}
#c{position:absolute;left:0;top:0;display:block}
.hud{position:absolute;z-index:5}
#hudwrap{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .4s}
#hudwrap.on{opacity:1}
#hudwrap .ui,#hudwrap .btn,#hudwrap #mini,#joy{pointer-events:auto}
#mini{position:absolute;left:calc(14px + var(--sa-l, 0px));top:calc(14px + var(--sa-t, 0px));border-radius:50%;border:4px solid #fff;box-shadow:0 4px 0 rgba(30,40,70,.25);background:#9fd067;transition:transform .2s}
#mini.small{transform:scale(.62);transform-origin:0 0}
#street{position:absolute;left:50%;top:calc(14px + var(--sa-t, 0px));transform:translateX(-50%) translateY(-8px);background:#fff;color:#2d3a55;border-radius:999px;padding:6px 20px 7px;font-size:clamp(14px,2.3vw,21px);font-weight:800;box-shadow:0 4px 0 rgba(30,40,70,.22);white-space:nowrap;opacity:0;transition:all .3s}
#street.show{opacity:1;transform:translateX(-50%)}
#hp{position:absolute;right:calc(16px + var(--sa-r, 0px));top:calc(16px + var(--sa-t, 0px));display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.94);border-radius:999px;padding:6px 14px;box-shadow:0 4px 0 rgba(30,40,70,.22);opacity:0;transition:opacity .3s}
#hp.show{opacity:1}
#hp .bar{width:min(150px,18vw);height:12px;border-radius:6px;background:#e3e6ee;overflow:hidden}
#hpfill{display:block;height:100%;width:100%;background:#ff5a6a;border-radius:6px;transition:width .2s}
#hp span{color:#ff5a6a;font-size:18px;font-weight:800}
#topright{position:absolute;right:calc(16px + var(--sa-r, 0px));top:calc(60px + var(--sa-t, 0px));display:flex;gap:8px}
.ui{background:rgba(255,255,255,.9);color:#2d3a55;border:none;border-radius:999px;padding:6px 12px;font:700 14px inherit;font-family:inherit;box-shadow:0 3px 0 rgba(30,40,70,.2);cursor:pointer}
#joy{position:absolute;left:calc(46px + var(--sa-l, 0px));bottom:calc(36px + var(--sa-b, 0px));width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.22);border:4px solid rgba(255,255,255,.75);display:none}
#knob{position:absolute;left:44px;top:44px;width:54px;height:54px;border-radius:50%;background:rgba(255,255,255,.92);box-shadow:0 4px 0 rgba(30,40,70,.25)}
body.touch #joy{display:block}
.btn{position:absolute;border-radius:50%;display:none;align-items:center;justify-content:center;font-weight:900;color:#fff;box-shadow:0 5px 0 rgba(30,40,70,.28);border:4px solid #fff;font-family:inherit;transition:transform .05s}
.btn.on{transform:scale(.92)}
body.touch .btn{display:flex}
#bA{right:calc(44px + var(--sa-r, 0px));bottom:calc(44px + var(--sa-b, 0px));width:100px;height:100px;background:#ff6b4a;font-size:28px}
#bB{right:calc(162px + var(--sa-r, 0px));bottom:calc(30px + var(--sa-b, 0px));width:74px;height:74px;background:#3fa7ff;font-size:18px}
#bC{right:calc(70px + var(--sa-r, 0px));bottom:calc(164px + var(--sa-b, 0px));width:74px;height:74px;background:#56c26b;font-size:18px}
#bD{right:calc(166px + var(--sa-r, 0px));bottom:calc(122px + var(--sa-b, 0px));width:62px;height:62px;background:#f97316;font-size:16px}
body.touch #bD.hide{display:none}
#money{position:absolute;left:calc(18px + var(--sa-l, 0px));top:calc(206px + var(--sa-t, 0px));background:rgba(255,255,255,.94);color:#15803d;font-weight:900;font-size:17px;padding:4px 12px;border-radius:999px;box-shadow:0 3px 0 rgba(30,40,70,.2);display:none}
#money.show{display:block}
#mission{position:absolute;left:50%;bottom:calc(12px + var(--sa-b, 0px));transform:translateX(-50%);background:rgba(17,24,39,.82);color:#fff;border-radius:14px;padding:6px 16px;text-align:center;display:none;max-width:52vw;pointer-events:none}
#mission.show{display:block}
#mission b{display:block;font-size:clamp(13px,1.9vw,17px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#mission span{font-size:13px;color:#fcd34d;font-weight:700}
#mission.hurry span{color:#f87171}
#bubbles{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.bub{position:absolute;transform:translate(-50%,-100%);background:#fff;color:#2d3a55;font-weight:900;font-size:clamp(13px,1.9vw,19px);padding:4px 12px 5px;border-radius:12px;border:3px solid #2d3a55;white-space:nowrap}
.bub:after{content:'';position:absolute;left:50%;bottom:-10px;margin-left:-7px;border:7px solid transparent;border-top-color:#2d3a55;border-bottom:0}
.bub.pow{background:none;border:none;color:#ffd23f;font-size:clamp(28px,4vw,44px);-webkit-text-stroke:3px #c2410c;transform:translate(-50%,-50%) rotate(-12deg)}
.bub.pow:after{display:none}
#banner{position:absolute;left:50%;top:62px;transform:translateX(-50%) scale(.9);padding:8px 22px;border-radius:12px;font-weight:900;font-size:clamp(15px,2.4vw,22px);color:#fff;opacity:0;transition:all .3s;white-space:nowrap}
#banner.show{opacity:1;transform:translateX(-50%) scale(1)}
#banner.red{background:#e11d48;box-shadow:0 4px 0 #9f1239}
#banner.green{background:#16a34a;box-shadow:0 4px 0 #166534}
#meter{position:absolute;left:50%;top:106px;transform:translateX(-50%);width:160px;height:8px;border-radius:4px;background:rgba(255,255,255,.6);overflow:hidden;display:none}
#meter i{display:block;height:100%;width:0;background:#16a34a}
#bust{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(20,30,60,.45);color:#fff;font-size:clamp(44px,9vw,96px);font-weight:900;-webkit-text-stroke:3px #1e3a8a;opacity:0;pointer-events:none;transition:opacity .25s}
#bust.show{opacity:1}
#title{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:linear-gradient(rgba(169,184,207,.35),rgba(169,184,207,.75));transition:opacity .5s}
#title.hide{opacity:0;pointer-events:none}
#title h1{margin:0;font-size:clamp(40px,8vw,84px);color:#fff;-webkit-text-stroke:3px #2d3a55;font-weight:900;letter-spacing:2px;text-shadow:0 6px 0 rgba(30,40,70,.25)}
#subtitle{font-size:clamp(16px,2.6vw,24px);font-weight:900;color:#2d3a55;background:#fff;border-radius:999px;padding:4px 18px}
#tagline{color:#2d3a55;font-weight:700;font-size:clamp(13px,1.8vw,17px);text-align:center;padding:0 16px}
#startBtn{margin-top:8px;font-family:inherit;font-size:clamp(20px,3vw,28px);font-weight:900;color:#fff;background:#ff6b4a;border:4px solid #fff;border-radius:999px;padding:10px 46px;box-shadow:0 6px 0 rgba(30,40,70,.3);cursor:pointer}
#startBtn:disabled{opacity:.5}
#controls{color:#2d3a55;font-size:13px;font-weight:700;text-align:center;padding:0 16px}
#credit{position:absolute;bottom:8px;left:0;right:0;text-align:center;color:#2d3a55;font-size:11px;opacity:.8}
#loading{color:#2d3a55;font-weight:700}
#loadbar{display:none;width:min(260px,60vw);height:10px;border-radius:5px;background:rgba(255,255,255,.7);overflow:hidden}
#loadbar i{display:block;height:100%;width:0;background:#ff6b4a;border-radius:5px;transition:width .15s}
#langBtn{position:absolute;top:14px;right:14px}
#dbg{position:absolute;left:50%;bottom:6px;transform:translateX(-50%);color:#fff;font:12px monospace;text-shadow:0 1px 2px #000;z-index:30}
#street small{margin-left:10px;font-size:.62em;font-weight:700;opacity:.65}
#banner.blue{background:#2563eb;box-shadow:0 4px 0 #1e3a8a}
.modal{position:absolute;inset:0;z-index:25;display:none;align-items:center;justify-content:center;background:rgba(30,40,70,.45);padding:12px}
.modal.show{display:flex}
#bigmap{padding:0;background:#9fd067;z-index:26}
#bmCanvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab}
#bmTop{position:absolute;top:calc(10px + var(--sa-t, 0px));left:calc(10px + var(--sa-l, 0px));right:calc(10px + var(--sa-r, 0px));display:flex;gap:8px;max-width:520px}
#bmQ{flex:1;min-width:0;font:700 16px inherit;font-family:inherit;padding:8px 14px;border-radius:999px;border:3px solid #fff;box-shadow:0 3px 0 rgba(30,40,70,.25);outline:none;color:#2d3a55}
#bigmap .x{background:#fff;color:#2d3a55;border:none;border-radius:999px;width:40px;height:40px;font:900 16px inherit;font-family:inherit;box-shadow:0 3px 0 rgba(30,40,70,.25);flex:none;cursor:pointer}
#bmChips{position:absolute;top:calc(60px + var(--sa-t, 0px));left:calc(10px + var(--sa-l, 0px));right:10px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;max-width:620px}
#bmChips button,#bmZoom button,#bmCard button{border:none;border-radius:999px;background:#fff;color:#2d3a55;font:800 13px inherit;font-family:inherit;padding:6px 11px;white-space:nowrap;box-shadow:0 2px 0 rgba(30,40,70,.2);cursor:pointer}
#bmChips button.on{background:#2d3a55;color:#fff}
#bmList{position:absolute;top:calc(98px + var(--sa-t, 0px));left:calc(10px + var(--sa-l, 0px));width:min(340px,60%);max-height:calc(100% - 112px);overflow:auto;background:rgba(255,255,255,.96);border-radius:16px;color:#2d3a55;font-size:14px}
#bmList:empty{display:none}
#bmList div{padding:8px 12px;border-bottom:1px solid #eef1f6;cursor:pointer;display:flex;justify-content:space-between;gap:8px}
#bmList small{opacity:.6;flex:none}
#bmList p{margin:10px 12px}
#bmZoom{position:absolute;right:calc(10px + var(--sa-r, 0px));bottom:calc(14px + var(--sa-b, 0px));display:flex;flex-direction:column;gap:6px}
#bmZoom button{width:40px;height:40px;padding:0;font-size:18px}
#bmCard{position:absolute;left:50%;bottom:calc(14px + var(--sa-b, 0px));transform:translateX(-50%);background:#fff;color:#2d3a55;border-radius:18px;padding:10px 14px;box-shadow:0 4px 0 rgba(30,40,70,.25);display:none;text-align:center;max-width:min(420px,70%)}
#bmCard.show{display:block}
#bmCard b{display:block;font-size:16px}
#bmCard div{display:flex;gap:8px;justify-content:center;margin-top:8px}
#bmCard button{font-size:15px;padding:8px 16px}
#bmGo{background:#06b6d4!important;color:#fff!important}
#bmTp{background:#7c3aed!important;color:#fff!important}
#bmMsg{display:block;color:#dc2626;font-weight:700}
#plistBody h3{font-size:16px;margin:10px 0 4px}
#plistBody .plist{list-style:none;margin:0;padding:0;font-size:15px;line-height:1.75}
#plistBody .plist li.done{color:#16a34a}
#plistBody .phint{font-size:13px;opacity:.75;margin:0}
.card{background:#fff;color:#2d3a55;border-radius:22px;box-shadow:0 6px 0 rgba(30,40,70,.3);padding:12px 18px 14px;width:min(460px,100%);max-height:100%;overflow:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;overscroll-behavior:contain}
.card h2{margin:0 0 8px;font-size:20px;font-weight:900;display:flex;align-items:center;justify-content:space-between;gap:10px}
.card .x{background:#eef1f6;color:#2d3a55;border:none;border-radius:999px;width:34px;height:34px;font:900 16px inherit;font-family:inherit;cursor:pointer;flex:none}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:5px 0;border-top:2px solid #eef1f6;font-weight:800;font-size:15px}
.seg{display:flex;background:#eef1f6;border-radius:999px;padding:3px;gap:2px;flex:none}
.seg button{border:none;background:none;color:#5b6782;font:800 14px inherit;font-family:inherit;padding:5px 12px;border-radius:999px;cursor:pointer;white-space:nowrap}
.seg button.on{background:#ff6b4a;color:#fff;box-shadow:0 2px 0 rgba(30,40,70,.2)}
.card .wide{display:block;width:100%;margin-top:8px;text-align:center}
.credits p{margin:6px 0;font-size:14px;line-height:1.45;font-weight:600}
.credits b{font-weight:900}
.credits a{color:#2563eb}
#titleCredits{position:absolute;top:14px;left:14px}

#sgBtn{font-family:inherit;font-size:clamp(15px,2.2vw,20px);font-weight:900;color:#f2c14e;background:#2b211a;border:3px solid #f2c14e;border-radius:999px;padding:7px 26px;box-shadow:0 5px 0 rgba(30,40,70,.3);cursor:pointer}
#sgBtn:disabled{opacity:.5}
#sg{padding:0;background:#2b211a;z-index:27;color:#f5ebdd;font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
#sgMap,#sgTable{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab}#sgTable{pointer-events:none;display:none}#sg.t3d #sgTable{display:block}
#sgTop{position:absolute;left:0;right:0;top:0;height:48px;box-sizing:border-box;padding:0 calc(10px + var(--sa-r,0px)) 0 calc(10px + var(--sa-l,0px));display:flex;align-items:center;gap:8px;background:rgba(38,29,22,.95);border-bottom:1.5px solid #8a6a3a}
#sgTitle{font:900 20px 'STKaiti','KaiTi','Kaiti SC',serif;color:#f2c14e;letter-spacing:1px;white-space:nowrap}
#sgDate{background:#f2c14e;color:#2b211a;border-radius:999px;padding:3px 10px;font-weight:800;font-size:13px;white-space:nowrap}
#sgRes{flex:1;display:flex;gap:6px;justify-content:flex-start;overflow:hidden;min-width:0}#sgRes>span:first-child{margin-left:auto}
#sgRes.tight small,#sgRes.tighter small{display:none}#sgRes.tighter>span:last-child{display:none}
#sgRes span{display:flex;align-items:center;gap:4px;background:#3a2c21;border:1px solid #5c4630;border-radius:999px;padding:2px 9px 2px 3px;font-weight:800;font-size:13px;white-space:nowrap}
#sgRes i{font-style:normal;width:18px;height:18px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:#2b211a;font-size:11px;font-weight:900}
#sgTop button,.sgSmall{background:#3a2c21;color:#f5ebdd;border:1px solid #8a6a3a;border-radius:999px;height:34px;padding:0 12px;font:800 13px inherit;font-family:inherit;cursor:pointer;white-space:nowrap}
#sgPanel{position:absolute;left:calc(8px + var(--sa-l,0px));top:56px;bottom:8px;width:min(300px,max(240px,30%));box-sizing:border-box;overflow:auto;-webkit-overflow-scrolling:touch;touch-action:none;overscroll-behavior:contain;background:rgba(38,29,22,.94);border:1.5px solid #8a6a3a;border-radius:14px;padding:10px 10px 14px}
#sgPanel h3{margin:0 0 2px;font-size:18px;display:flex;align-items:center;gap:6px}
#sgPanel h4{margin:12px 0 6px;font:900 16px 'STKaiti','KaiTi','Kaiti SC',serif;color:#f2c14e}
.sgDot{width:10px;height:10px;border-radius:5px;display:inline-block;flex:none}
.sgX{margin-left:auto;background:#3a2c21;color:#f5ebdd;border:1px solid #5c4630;border-radius:999px;width:32px;height:32px;font:900 14px inherit;font-family:inherit;cursor:pointer;flex:none}
.sgSub{font-size:12px;color:#d9c8ae;margin-bottom:8px}
.sgHint{font-size:12px;color:#d9c8ae;line-height:1.45;margin:4px 0}
.sgWarn{font-size:12px;color:#fff;background:#a33a3a;border-radius:8px;padding:6px 8px;margin:6px 0}
.sgPick{font-size:13px;color:#2b211a;background:#f2c14e;border-radius:8px;padding:6px 8px;margin:8px 0 6px;font-weight:800}
.sgGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.sgGrid div{background:#33271e;border-radius:8px;padding:5px 8px}
.sgGrid small{display:block;font-size:11px;color:#d9c8ae}.sgGrid b{font-size:15px}
.sgCmds{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.sgCmd{min-height:46px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#3a2c21;color:#f5ebdd;border:1px solid #8a6a3a;border-radius:10px;font-family:inherit;cursor:pointer;padding:3px}
.sgCmd b{font-size:14px}.sgCmd small{font-size:10px;color:#d9c8ae}
.sgCmd.on{background:#f2c14e;color:#2b211a;border-color:#f2c14e}.sgCmd.on small{color:#5a4632}
.sgCmd:disabled{opacity:1;background:#2b221b;color:#94877a;border-color:#4d3f31;cursor:default}.sgCmd:disabled small{color:#94877a!important}
.sgTo{margin:8px 0 4px;font-weight:900;color:#f2c14e}
.sgSeg{display:flex;flex-wrap:wrap;gap:5px;align-items:center;font-size:12px;color:#d9c8ae}
.sgSeg button,.sgChips button{background:#3a2c21;color:#f5ebdd;border:1px solid #5c4630;border-radius:999px;min-height:32px;padding:0 10px;font:800 12px inherit;font-family:inherit;cursor:pointer}
.sgSeg button.on,.sgChips button.on{background:#f2c14e;color:#2b211a;border-color:#f2c14e}
.sgChips{display:flex;flex-wrap:wrap;gap:5px}
.sgG{display:flex;gap:8px;padding:8px;background:#33271e;border:1px solid #5c4630;border-radius:10px;margin-bottom:6px}
.sgGi{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}.sgGi>b{font-size:15px;color:#fff}
.sgP{flex:none;border-radius:50%;border:2px solid #f2c14e;display:flex;align-items:center;justify-content:center;color:#fff;font-family:'STKaiti','KaiTi','Kaiti SC',serif;font-weight:900;box-sizing:border-box}
.sgSt{display:flex;align-items:center;gap:5px;font-size:10px;color:#d9c8ae}.sgSt span{width:26px}
.sgSt i{flex:1;height:5px;background:#4a3a2c;border-radius:3px;overflow:hidden}.sgSt i b{display:block;height:5px}
.sgSt em{width:20px;text-align:right;font-style:normal;font-weight:800;color:#f5ebdd}
.sgTrw{display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin-top:2px}
.sgTr{font-size:11px;font-weight:900;color:#2b211a;background:#f2c14e;border-radius:4px;padding:0 5px}.sgTrw small{font-size:10.5px;color:#d9c8ae}
.sgWhere{font-size:11px;color:#d9c8ae;margin:-3px 0 8px 4px}
.sgBond{font-size:12px;background:#4a2f2f;border:1px solid #a35a4a;border-radius:8px;padding:4px 8px;margin:4px 0;color:#ffd7c4}
.sgRoadRow{display:flex;align-items:center;gap:6px;font-size:13px;padding:3px 0}.sgRoadRow small{margin-left:auto;color:#d9c8ae;font-size:11px}
#sgTop #sgEnd{background:#f2c14e;color:#2b211a;border:2px solid #fff;font-weight:900;font-size:15px;padding:0 16px;box-shadow:0 2px 0 rgba(0,0,0,.3)}
#sgLayer{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(20,14,10,.6);padding:10px;box-sizing:border-box}
#sgLayer.show{display:flex}
.sgCard{background:#261d16;border:2px solid #8a6a3a;border-radius:18px;padding:12px 16px 14px;width:min(520px,100%);max-height:100%;overflow:auto;-webkit-overflow-scrolling:touch;touch-action:none;box-sizing:border-box}
.sgCard h2{margin:0 0 8px;font:900 22px 'STKaiti','KaiTi','Kaiti SC',serif;color:#f2c14e;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sgCard h2 small{font:700 13px system-ui,sans-serif;color:#d9c8ae}
.sgCenter{text-align:center;justify-content:center}
.sgEv{list-style:none;margin:0 0 10px;padding:0;font-size:14px;line-height:1.5}
.sgEv li{padding:3px 0;border-bottom:1px solid #3a2c21;color:#d9c8ae}.sgEv li.me{color:#f5ebdd}.sgEv li.imp{color:#ffd27a;font-weight:800}.sgEv small{opacity:.6;margin-right:4px}
.sgBig{display:block;width:100%;min-height:46px;margin-top:8px;background:#f2c14e;color:#2b211a;border:none;border-radius:12px;font:900 16px inherit;font-family:inherit;cursor:pointer}
.sgBig.alt{background:#3a2c21;color:#f5ebdd;border:1px solid #8a6a3a}
.sgReveal{display:flex;gap:14px;align-items:center}.sgReveal>div{flex:1;min-width:0}
.sgBigName{font:900 28px 'STKaiti','KaiTi','Kaiti SC',serif;color:#fff;margin-bottom:4px}

.sgReveal.item{align-items:center}.sgTruce{color:#7fd1a1!important;font-weight:700}.sgGive{align-items:center}.sgGive span{font-size:12px;color:#7a5a3a;font-weight:700;margin-right:2px}
#sgTut{position:absolute;left:330px;bottom:14px;width:min(330px,46%);background:#fff8ea;color:#3a2a1c;border:3px solid #f2c14e;border-radius:14px;padding:10px 12px;box-shadow:0 10px 30px rgba(0,0,0,.5);display:none;font-size:14px;line-height:1.5}
#sgTut.show{display:block;animation:sgPop .25s}#sgTut b{color:#b8860b;font-size:12px}#sgTut p{margin:2px 0 8px}#sgTut div{display:flex;justify-content:flex-end;gap:8px}
#sgTut button{border:0;border-radius:999px;padding:7px 16px;font-weight:900;background:#e8dcc6;color:#5a4632;font-family:inherit}#sgTut button.go{background:#f2c14e;color:#3a2a1c}
.sgTutHi{outline:3px solid #f2c14e!important;outline-offset:2px;animation:sgTutHi 1s infinite;position:relative;z-index:2}
@keyframes sgTutHi{0%,100%{box-shadow:0 0 0 0 rgba(242,193,78,.9)}50%{box-shadow:0 0 0 9px rgba(242,193,78,0)}}
#sg.small #sgTut{font-size:12.5px;padding:8px 10px;bottom:8px}
/* v1.1 (D-100): duels and battles with some theatre */
.sgDuel.arena{align-items:flex-start;justify-content:center;gap:10px;margin:4px 0}
.sgDs.dc{width:auto;flex:1;max-width:210px;flex-direction:column;align-items:center;gap:5px;--dir:1}.sgDs.dc.foe{--dir:-1}
.sgDc{position:relative}.sgDs.dc .sgDi{width:100%;max-width:150px;align-items:stretch;text-align:center}.sgDs.dc .sgDi>span{display:flex;align-items:center;gap:5px}
.sgDs.dc .sgHp,.sgDs.dc .sgSp{flex:1}.sgDs.dc .sgDi b{font-size:15px}.sgDs.dc .sgCardT .sgCglyph{font-size:44px;color:#fff}
.sgDs.dc.lunge .sgCardT{animation:sgLunge .45s cubic-bezier(.3,1.6,.5,1)}.sgDs.dc.brace .sgCardT{animation:sgBrace .45s}.sgDs.dc.whiff .sgCardT{animation:sgWhiff .4s}
.sgDs.dc.hit .sgCardT{animation:sgHit .4s .12s}.sgDs.dc.hit .sgDc::after{content:'';position:absolute;inset:0;border-radius:8px;background:#ff3b30;opacity:0;animation:sgFlash .45s .1s}
.sgDs.dc.lunge.hit .sgCardT{animation:sgLunge .45s cubic-bezier(.3,1.6,.5,1),sgHit .4s .45s}
.sgDs.dc.ko .sgCardT,.sgDs.dc.lose .sgCardT{filter:grayscale(.85) brightness(.75);transform:rotate(calc(var(--dir)*-13deg)) translateY(10px);transition:transform .5s .35s,filter .5s .35s}
.sgDs.dc.win .sgCardT{transform:scale(1.07);box-shadow:0 0 0 3px #f2c14e,0 0 26px rgba(242,193,78,.95);transition:transform .4s .3s,box-shadow .4s .3s}
.sgMv{position:absolute;left:50%;top:-9px;transform:translateX(-50%);white-space:nowrap;font:900 12px system-ui,sans-serif;font-style:normal;color:#fff;padding:2px 9px;border-radius:999px;border:2px solid #fff;animation:sgMv .3s cubic-bezier(.3,1.7,.5,1);z-index:2}
.sgMv.atk{background:#d64545}.sgMv.def{background:#2f7de1}.sgMv.skill{background:#7a4fd0;box-shadow:0 0 10px #c9a6ff}
.sgDs.dc .sgDmg{top:34%;font-size:32px;z-index:3;animation-delay:.15s;opacity:0}.sgDs.dc .sgKo{top:30%;z-index:3}
.sgSeal{position:absolute;right:-12px;bottom:-8px;width:42px;height:42px;border-radius:8px;background:#c0392b;color:#fff;border:2px solid #fff;font:900 24px/40px 'STKaiti','KaiTi','Kaiti SC',serif;font-style:normal;text-align:center;transform:rotate(-10deg);animation:sgStamp .35s .5s cubic-bezier(.3,1.8,.5,1) backwards;z-index:3;box-shadow:0 3px 8px rgba(0,0,0,.4)}
html[lang=en] .sgSeal{font:900 12px/40px system-ui,sans-serif}
.sgDuel.arena .sgVs{align-self:center;position:relative;min-width:34px;text-align:center}
.sgVs.slash::after,.sgVs.burst::after,.sgVs.clink::after{content:'';position:absolute;left:50%;top:50%;pointer-events:none}
.sgVs.slash::after{width:120px;height:5px;margin:-2px 0 0 -60px;background:linear-gradient(90deg,transparent,#fff,#ffd98a,transparent);border-radius:3px;transform:rotate(-32deg) scaleX(0);animation:sgSlash .35s .1s}
.sgVs.burst::after{width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;background:radial-gradient(circle,#fff,#f2c14e 40%,rgba(201,166,255,.7) 60%,transparent 70%);animation:sgBurst .5s .1s}
.sgVs.clink::after{width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;background:#fff;animation:sgBurst .3s}
@keyframes sgLunge{0%{transform:none}45%{transform:translateX(calc(var(--dir)*38px)) rotate(calc(var(--dir)*7deg)) scale(1.06)}100%{transform:none}}
@keyframes sgBrace{0%,100%{transform:none;box-shadow:none}40%{transform:scale(.95);box-shadow:0 0 0 4px #7fb2f0,0 0 18px #2f7de1}}
@keyframes sgWhiff{0%,100%{transform:none}50%{transform:translateX(calc(var(--dir)*14px))}}
@keyframes sgFlash{0%{opacity:0}30%{opacity:.55}100%{opacity:0}}
@keyframes sgMv{0%{transform:translateX(-50%) scale(.2)}100%{transform:translateX(-50%) scale(1)}}
@keyframes sgStamp{0%{transform:rotate(-10deg) scale(2.6);opacity:0}100%{transform:rotate(-10deg) scale(1);opacity:1}}
@keyframes sgSlash{0%{transform:rotate(-32deg) scaleX(0);opacity:1}60%{transform:rotate(-32deg) scaleX(1.2);opacity:1}100%{transform:rotate(-32deg) scaleX(1.5);opacity:0}}
@keyframes sgBurst{0%{transform:scale(.3);opacity:1}100%{transform:scale(7);opacity:0}}
#sg.small .sgDs.dc{flex-direction:row;align-items:center;gap:6px;max-width:none}#sg.small .sgDs.dc.foe{flex-direction:row-reverse}#sg.small .sgDs.dc .sgDi{text-align:left;max-width:none;flex:1}
#sg.small .sgDuel.arena .sgCardT{width:60px;height:82px}#sg.small .sgDs.dc .sgCardT .sgCglyph{top:24px;font-size:27px}#sg.small .sgDuel.arena .sgCtier{display:none}#sg.small .sgDuel.arena .sgCname{font-size:10px}#sg.small .sgDuel.arena .sgCstat,#sg.small .sgDuel.arena .sgCstar{display:none}
#sg.small .sgSeal{width:30px;height:30px;font-size:17px;line-height:28px;right:-8px}#sg.small .sgDs.dc .sgDmg{font-size:24px}#sg.small .sgMv{font-size:10px;padding:1px 6px;top:-7px}
.sgBattle.charge .sgBside.me .sgBcards{animation:sgChargeL .5s cubic-bezier(.2,1.4,.4,1)}.sgBattle.charge .sgBside:not(.me) .sgBcards{animation:sgChargeR .5s cubic-bezier(.2,1.4,.4,1)}.sgBattle.charge .sgVs{animation:sgStamp .4s .35s backwards}
@keyframes sgChargeL{0%{transform:translateX(-140%);opacity:0}70%{transform:translateX(14px);opacity:1}100%{transform:none}}
@keyframes sgChargeR{0%{transform:translateX(140%);opacity:0}70%{transform:translateX(-14px);opacity:1}100%{transform:none}}
.sgBhead{position:relative}.sgLoss{position:absolute;right:0;top:-4px;font:900 15px system-ui,sans-serif;font-style:normal;color:#ff6a5a;-webkit-text-stroke:1px #2b211a;animation:sgDmg .9s ease-out forwards;pointer-events:none}
.sgBside.beaten .sgCardT{filter:grayscale(.85) brightness(.75);transform:rotate(-6deg) translateY(6px);transition:all .4s}.sgBside.victor .sgCardT{box-shadow:0 0 0 2px #f2c14e,0 0 16px rgba(242,193,78,.85);transition:all .4s}
.sgBres.stamp{display:block;width:max-content;margin:8px auto;padding:3px 18px;border-radius:8px;border:3px solid currentColor;font:900 24px 'STKaiti','KaiTi','Kaiti SC',serif;transform:rotate(-4deg);animation:sgStamp .35s cubic-bezier(.3,1.8,.5,1)}
.sgBres.stamp:empty{display:none}.sgBres.stamp.won{color:#f2c14e}.sgBres.stamp.lost{color:#ff8a80}
/* v1.2: marching together, officer biographies, difficulty */
.sgWith button.on{background:#f2c14e;color:#2b211a;border-color:#f2c14e}.sgWith button.on small{color:#5a4632}
.sgBio{margin:6px 0 0;font-size:13px;line-height:1.55;color:#4a3826;text-align:left}.sgReveal .sgBio{color:#e9dcc6;font-size:12.5px;margin-top:4px}
/* v1.3 (D-109): portraits instead of a single character */
.sgPf{position:absolute;inset:0;border-radius:50%;overflow:hidden;display:block}.sgPf img{position:absolute;left:-14%;top:-10%;width:128%;height:128%;display:block}
.sgCglyph{pointer-events:none}.sgCimg{display:block;width:1.95em;height:1.95em;margin:-.52em auto 0;filter:drop-shadow(0 2px 0 rgba(0,0,0,.25))}
/* v1.3 (D-113): lacquer, walnut and gold instead of flat brown boxes */
#sg{--lq1:#2d211a;--lq2:#1f1712;--gold:#d9b25a;--gold2:#a8823a;--ver:#b8352a;--serif:'Kaiti SC','STKaiti','KaiTi','Songti SC','STSong','Noto Serif CJK SC','Source Han Serif SC',serif}
#sgTop{background:repeating-linear-gradient(90deg,rgba(255,255,255,.02) 0 2px,transparent 2px 7px),linear-gradient(180deg,#4a3324,#2e2018 60%,#261a13);border-bottom:none;box-shadow:inset 0 -1px 0 var(--gold2),inset 0 -4px 0 #1a120d,inset 0 -5px 0 rgba(217,178,90,.55),0 3px 10px rgba(0,0,0,.45)}
#sgTop h1,#sgTop .sgTitle{font-family:var(--serif)!important;letter-spacing:1px}
#sgPanel{background:radial-gradient(120% 60% at 50% 0,rgba(255,220,160,.07),transparent 60%),repeating-linear-gradient(45deg,rgba(255,255,255,.012) 0 2px,transparent 2px 5px),linear-gradient(180deg,var(--lq1),var(--lq2));border:1px solid var(--gold2);box-shadow:inset 0 0 0 3px #1a120d,inset 0 0 0 4px rgba(217,178,90,.35),0 6px 18px rgba(0,0,0,.5)}
#sgPanel h4,.sgCard h2{font-family:var(--serif);letter-spacing:.5px}
.sgO{background:linear-gradient(180deg,#3a2b20,#2c2018);border:1px solid #6a5034;box-shadow:inset 0 1px 0 rgba(255,230,180,.08),0 1px 0 rgba(0,0,0,.35)}
.sgCmd{background:linear-gradient(180deg,#46352a,#33261c);border:1px solid #8a6a3a;box-shadow:inset 0 1px 0 rgba(255,230,180,.12),0 1px 0 rgba(0,0,0,.4);transition:transform .08s}
.sgCmd:active{transform:translateY(1px)}
.sgCmd.on{background:linear-gradient(180deg,#d14a33,var(--ver));color:#fff7e6;border-color:var(--gold);box-shadow:inset 0 0 0 1px rgba(255,220,160,.35),0 1px 0 rgba(0,0,0,.4)}
.sgO .sgCmd.on small,.sgCmd.on small{color:#ffe2a8}
.sgCmd:disabled{background:#241a14;box-shadow:none}
.sgBig{background:linear-gradient(180deg,#f0cd72,#d9a83c);color:#2b1d12;border:1px solid #8a6a3a;box-shadow:inset 0 1px 0 rgba(255,255,255,.45),inset 0 -2px 0 rgba(120,80,20,.35),0 2px 0 rgba(0,0,0,.35);font-family:var(--serif)!important;letter-spacing:1px}
.sgBig.alt{background:linear-gradient(180deg,#46352a,#33261c);color:#f5ebdd;border:1px solid #8a6a3a;box-shadow:inset 0 1px 0 rgba(255,230,180,.12),0 2px 0 rgba(0,0,0,.35)}
#sgTop #sgEnd{background:linear-gradient(180deg,#d14a33,var(--ver));color:#fff7e6;border:1.5px solid var(--gold);box-shadow:inset 0 0 0 1px rgba(255,220,160,.3),0 2px 0 rgba(0,0,0,.4);font-family:var(--serif);letter-spacing:1px}
.sgCard{background:radial-gradient(120% 50% at 50% 0,rgba(255,220,160,.08),transparent 60%),linear-gradient(180deg,#2d211a,#1d1510);border:1px solid var(--gold2);box-shadow:inset 0 0 0 3px #150f0b,inset 0 0 0 4px rgba(217,178,90,.45),0 18px 40px rgba(0,0,0,.6)}
.sgSeg button,.sgChips button{background:linear-gradient(180deg,#46352a,#33261c);border-color:#6a5034;box-shadow:inset 0 1px 0 rgba(255,230,180,.1)}
.sgChips button.on,.sgSeg button.on{box-shadow:none}
.sgCardT{border-radius:9px;box-shadow:0 0 0 1px rgba(0,0,0,.35),0 3px 0 rgba(0,0,0,.35),inset 0 0 0 3px rgba(255,255,255,.35)}
/* v1.4 (D-114, D-115): buildings and the battle's history line */
.sgBlds{display:flex;flex-wrap:wrap;gap:5px;margin:2px 0 6px}
.sgBldC{display:inline-flex;align-items:center;gap:4px;background:linear-gradient(#4a3726,#33251a);border:1px solid #8a6a3a;border-radius:8px;padding:3px 7px;font-size:12px;color:#f5ebdd}
.sgBldC i{font-style:normal;color:#f2c14e;letter-spacing:1px;font-size:10px}
.sgBldPick{display:grid;grid-template-columns:1fr 1fr}.sgBldPick button{display:flex;flex-direction:column;align-items:flex-start;border-radius:10px;padding:4px 9px;text-align:left;min-height:40px}
.sgBldPick button b{color:#f2c14e;font-size:11px}.sgBldPick button.on b,.sgBldPick button:disabled b{color:inherit}
.sgBldPick button small{font-weight:600;font-size:10px;color:#d9c8ae;white-space:normal}
.sgBldPick button:disabled{opacity:.45}
.sgEdge{display:flex;justify-content:center;align-items:center;gap:8px;margin:-4px 0 6px;font-size:12px;font-weight:800;color:#f2c14e;text-align:center}
.sgEdge span{flex:1;min-height:1em}.sgEdge span:first-child{text-align:right}.sgEdge span:last-child{text-align:left}.sgEdge i{font-style:normal;color:#d9c8ae}
/* v1.5 (D-116): a city's monthly growth and income */
.sgGrow{font-style:normal;font-size:12px;font-weight:800;color:#9fd38f;margin-left:5px}
.sgInc{color:#f5ebdd}
/* v1.6 (D-120): bonds you can see */
#sgLayer.wide .sgCard{width:min(760px,100%)}
#sgPanel h4 small{font:700 12px system-ui,sans-serif;color:#d9c8ae;margin-left:4px}
.sgMini{float:right;font:800 12px system-ui,sans-serif;background:linear-gradient(#7a2a22,#5a1c17);color:#f5ebdd;border:1px solid #c8963e;border-radius:999px;padding:3px 10px;margin-top:-1px}
.sgBondR{background:linear-gradient(#33251a,#2a1f16);border:1px solid #5d4630;border-radius:12px;padding:7px 9px;margin:6px 0}
.sgBondR.on{border-color:#f2c14e;box-shadow:0 0 0 1px rgba(242,193,78,.35),0 0 14px rgba(242,193,78,.18) inset}
.sgBh{display:flex;align-items:baseline;gap:8px}.sgBh b{font:900 15px 'STKaiti','KaiTi','Kaiti SC',serif;color:#f5ebdd}.sgBondR.on .sgBh b{color:#f2c14e}
.sgBh i{font-style:normal;font-weight:900;font-size:12px;color:#2b211a;background:#d9c8ae;border-radius:6px;padding:0 6px}.sgBondR.on .sgBh i{background:#f2c14e}
.sgBh em{font-style:normal;font-size:11px;font-weight:700;color:#d9c8ae;margin-left:auto;text-align:right}.sgBondR.on .sgBh em{color:#9fd38f}
.sgBms{display:flex;flex-wrap:wrap;gap:6px 10px;margin:6px 0 4px}
.sgBm{display:flex;flex-direction:column;align-items:center;max-width:92px;text-align:center}
.sgBm b{font-size:11px;font-weight:800;color:#d9c8ae;margin-top:2px}.sgBm.on b{color:#f5ebdd}
.sgBm small{font-size:10px;line-height:1.25;color:#b8a68a}.sgBm.out{opacity:.45}
.sgMf{width:34px;height:34px;border-radius:50%;overflow:hidden;display:block;border:2px solid #5d4630;background:#4a3a2a;filter:grayscale(1) brightness(.75)}
.sgMf.on{filter:none;border-color:#f2c14e}.sgMf img{width:100%;height:100%;display:block}
.sgBfx{font-size:11px;font-weight:700;color:#f2c14e}
.sgBook{max-height:60vh;overflow:auto;touch-action:pan-y}
.sgBchip{display:inline-block;font-size:10px;font-weight:800;color:#d9c8ae;border:1px solid #6a5238;border-radius:6px;padding:0 4px;margin-left:2px}.sgBchip.on{color:#2b211a;background:#f2c14e;border-color:#f2c14e}
.sgWith button.bond{border-color:#f2c14e!important;box-shadow:0 0 0 1px rgba(242,193,78,.5)}
.sgBondOnH{color:#f2c14e!important;font-weight:800}
.sgLeadH{color:#f2d79a!important}
.sgBondBig{text-align:center}.sgBondBig .sgBigName{color:#f2c14e;font-size:26px}
.sgBfaces{display:flex;justify-content:center;gap:14px;margin:10px 0}.sgBfaces>div{display:flex;flex-direction:column;align-items:center;gap:4px;filter:grayscale(1) opacity(.55)}.sgBfaces>div.on{filter:none}
.sgBfaces b{font-size:13px;color:#f5ebdd}.sgBondBig.lost .sgBfaces>div{filter:grayscale(1)}
/* v1.7 (D-123): the granary and the rice market */
#sgRes small{font-size:10px;font-weight:800;color:#d9c8ae;margin-left:3px}#sgRes small.warn{color:#ff8a7a}
.sgWarn{color:#ffb0a4!important}
.sgTrade{display:flex;flex-wrap:wrap;align-items:center;gap:5px;margin:2px 0 6px;font-size:11px;color:#d9c8ae}
.sgTrade span{flex:1 0 100%}
.sgTrade button{display:flex;flex-direction:column;align-items:center;font:800 12px system-ui,sans-serif;background:linear-gradient(#4a3726,#33251a);color:#f5ebdd;border:1px solid #8a6a3a;border-radius:9px;padding:3px 9px;line-height:1.15}
.sgTrade button small{font-size:10px;color:#f2c14e}.sgTrade button:disabled{opacity:.4}
.sgSeg button small{display:block;font-size:10px;font-weight:700;opacity:.8}.sgSeg button:disabled{opacity:.35}
/* v1.8 (D-124): the sandtable view */
#sg.t3d{background-color:#2a1d14;background-size:256px 256px}
#sgZoom #sg3D{font:900 12px system-ui,sans-serif}#sgZoom #sg3D.off{opacity:.45}
</style>
