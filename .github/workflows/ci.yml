# Lint, unit tests, map reproducibility and the Playwright smoke test.
# No deployment here: GitHub Pages serves the main branch root as-is (D-03).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dev dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests (incl. headless gameplay simulation)
        run: npm test

      - name: maps/markham.json matches tools/build_map.py output
        run: npm run check:map

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Smoke test (desktop, phone landscape, phone portrait)
        run: npm run smoke

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14
